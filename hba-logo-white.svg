<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Ring - White -->
  <circle cx="150" cy="150" r="145" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.95" filter="url(#glow)"/>
  
  <!-- Main Shield Shape - White -->
  <path d="M 150 40 
           L 210 70 
           L 210 140 
           Q 210 180, 190 210
           Q 170 235, 150 250
           Q 130 235, 110 210
           Q 90 180, 90 140
           L 90 70 Z" 
        fill="#FFFFFF" 
        opacity="0.95"
        filter="url(#glow)"/>
  
  <!-- Inner Shield Detail - Dark Blue/Black -->
  <path d="M 150 60 
           L 195 82 
           L 195 135 
           Q 195 165, 180 187
           Q 165 205, 150 217
           Q 135 205, 120 187
           Q 105 165, 105 135
           L 105 82 Z" 
        fill="none" 
        stroke="#001F3F" 
        stroke-width="2.5"
        opacity="0.8"/>
  
  <!-- Star in Shield - Dark Blue -->
  <path d="M 150 95 
           L 158 118 
           L 182 118 
           L 163 132 
           L 171 155 
           L 150 141 
           L 129 155 
           L 137 132 
           L 118 118 
           L 142 118 Z" 
        fill="#001F3F" 
        opacity="0.9"/>
  
  <!-- HBA Letters - Dark Blue/Black -->
  <text x="150" y="190" 
        font-family="Arial Black, Arial, sans-serif" 
        font-size="42" 
        font-weight="900" 
        fill="#000814" 
        text-anchor="middle" 
        letter-spacing="2">HBA</text>
  
  <!-- Bottom Arc Text - HELLENIC - White -->
  <path id="topArc" d="M 55 150 A 95 95 0 0 1 245 150" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" letter-spacing="3" opacity="0.95">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      HELLENIC
    </textPath>
  </text>
  
  <!-- Bottom Text - White -->
  <text x="150" y="275" 
        font-family="Arial, sans-serif" 
        font-size="14" 
        font-weight="bold" 
        fill="#FFFFFF" 
        text-anchor="middle"
        letter-spacing="1.5"
        opacity="0.95">BODYGUARD</text>
  <text x="150" y="292" 
        font-family="Arial, sans-serif" 
        font-size="11" 
        font-weight="bold" 
        fill="#FFFFFF" 
        text-anchor="middle"
        letter-spacing="2"
        opacity="0.95">ASSOCIATION</text>
</svg>
